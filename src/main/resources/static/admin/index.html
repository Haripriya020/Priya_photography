<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Photography</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="logo">
                <span>PR</span>
            </div>

            <p class="small-title">PHOTOGRAPHY STUDIO</p>

            <h1>Admin Login</h1>

            <p class="subtitle">
                Sign in to manage bookings, messages and gallery.
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit" class="login-btn">
                    Sign In
                </button>

            </form>


            <p id="loginResult" class="login-result"></p>


            <a href="/" class="back-link">
                ← Back to Website
            </a>

        </div>

    </div>


    <script src="admin.js"></script>

</body>

</html>
